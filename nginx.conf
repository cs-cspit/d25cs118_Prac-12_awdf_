server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The React app calls relative /api/... URLs (same as the Vite dev proxy).
    # Inside the Compose network the backend is reached by its service name.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets never change - cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: /tasks, /login, ... all serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
